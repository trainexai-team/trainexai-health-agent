<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none" role="img" aria-label="TrainexAI">
  <title>TrainexAI</title>

  <!-- Mark: 48×48 rounded square — navy -->
  <rect x="2" y="2" width="48" height="48" rx="14" fill="#1E293B"/>

  <!-- T: bold geometric crossbar -->
  <rect x="10" y="13" width="30" height="6" rx="3" fill="#FFFFFF"/>

  <!-- T: bold geometric stem -->
  <rect x="19" y="13" width="10" height="28" rx="3" fill="#FFFFFF"/>

  <!-- Gold accent: premium underline offset slightly right -->
  <rect x="14" y="41" width="20" height="3" rx="1.5" fill="#D97706"/>

  <!-- Wordmark: 'Trainex' in navy -->
  <text
    x="66" y="34"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="20" font-weight="700"
    fill="#1E293B" letter-spacing="-0.02em"
  >Trainex</text>

  <!-- Wordmark: 'AI' in gold accent -->
  <text
    x="154" y="34"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="20" font-weight="700"
    fill="#D97706" letter-spacing="-0.02em"
  >AI</text>
</svg>
